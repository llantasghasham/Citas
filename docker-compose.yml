# Para levantarlo entero en un servidor propio: base de datos y aplicación.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: citas
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/citas?schema=public
      DATA_SOURCE: database
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?define NEXT_PUBLIC_SITE_URL}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-whish}
      WHISH_BASE_URL: ${WHISH_BASE_URL:-}
      WHISH_CHANNEL: ${WHISH_CHANNEL:-}
      WHISH_SECRET: ${WHISH_SECRET:-}
      WHISH_WEBSITE_URL: ${WHISH_WEBSITE_URL:-}
    ports:
      # SOLO el bucle local. Con `3000:3000` el contenedor quedaba publicado en
      # todas las interfaces, así que se podía llegar a la aplicación SIN pasar
      # por el proxy — y entonces `x-forwarded-host`, que este proyecto se cree,
      # lo escribe cualquiera. Se entra por nginx, que es quien fija esa cabecera.
      - '127.0.0.1:3000:3000'

volumes:
  db:
