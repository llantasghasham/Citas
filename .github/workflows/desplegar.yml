# Despliegue automatico a produccion (citas.posxml.com).
#
# Cada empujon a la rama de trabajo despliega solo. No hace falta que nadie entre
# al servidor: quien empuja, despliega.
#
# Como esta atado, porque este repositorio es PUBLICO:
#   - La llave de SSH_DEPLOY_KEY esta atada en el servidor, en authorized_keys,
#     a ejecutar UNICAMENTE /usr/local/bin/desplegar-citas.sh. Con ella no se
#     abre una shell ni se lee un archivo. Aunque el secreto se filtrase, el
#     techo es "volver a desplegar la rama publica", no "entrar al servidor".
#   - Solo corre en `push` a la rama. Nunca en `pull_request`: GitHub no entrega
#     secretos a los PR de terceros, y asi tampoco se intenta.
#   - La huella del servidor va fijada aqui abajo, asi que no vale que otra
#     maquina se haga pasar por el.

name: Desplegar a produccion

on:
  push:
    branches: [claude/invitation-render-engine-9sv1tp]
  workflow_dispatch:

# Dos despliegues a la vez se pisarian el arbol de trabajo del servidor.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  # Antes de tocar el servidor. Hasta ahora lo unico que separaba una errata de
  # produccion era que quien empuja se acordase de compilar en su maquina; el
  # servidor construia lo que llegara y el fallo se descubria con el sitio ya
  # tocado.
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Guardia de RTL y tipografia
        run: npm run lint:rtl

      - name: Construir, y que ninguna ruta salga estatica
        # Sin base de datos a proposito: si el build la necesitara, seria que
        # alguna ruta volvio a prerenderizarse, que es el fallo que ya tumbo el
        # PNG una vez. El layout raiz lee cabeceras, asi que cualquier segmento
        # que Next siga prerenderizando revienta al servirse, y eso se ve aqui.
        run: |
          npm run build 2>&1 | tee /tmp/build.txt
          sed -n '/Route (app)/,/Dynamic/p' /tmp/build.txt > /tmp/rutas.txt
          if grep -qE '^[|├└┌][^/]*[●○]' /tmp/rutas.txt; then
            echo "::error::hay rutas estaticas; el layout raiz lee cabeceras y reventaran al servirse"
            grep -E '^[|├└┌][^/]*[●○]' /tmp/rutas.txt
            exit 1
          fi
          echo "OK: ninguna ruta estatica"

  desplegar:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Preparar la llave y fijar el servidor
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SERVER_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPGQDpvBrmHHyMad5H54HocoGHWrzck1SU8AgkQCpsFx" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar
        run: |
          # No se manda ningun comando: authorized_keys ya obliga al script de
          # despliegue. Lo que se ve aqui abajo es su salida completa.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"

      - name: Comprobar que el sitio responde
        run: |
          # /render/... va en la lista a proposito: es el lienzo que Chromium
          # captura, NO pasa por la tabla `Render`, y es justo lo que se rompio
          # sin que nadie lo viera. Un 200 en /api/render/... servido desde la
          # cache no prueba nada; este si.
          for ruta in / /ejemplos /entrar /i/ejemplo-ar /render/ejemplo-ar /api/render/ejemplo-ar; do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://citas.posxml.com$ruta")"
            echo "$ruta -> $codigo"
            [ "$codigo" = "200" ] || { echo "::error::$ruta devolvio $codigo"; exit 1; }
          done

      - name: Comprobar que la imagen es una imagen
        run: |
          # Un 200 con una pagina de error dentro tambien es un 200.
          tipo="$(curl -s -o /tmp/prueba.png -w '%{content_type}' --max-time 90 \
            'https://citas.posxml.com/api/render/ejemplo-ar')"
          echo "content-type: $tipo"
          [ "$tipo" = "image/png" ] || { echo "::error::no devolvio un PNG"; exit 1; }
          file /tmp/prueba.png | grep -q '1080 x 1920' \
            || { echo "::error::el PNG no mide 1080x1920"; file /tmp/prueba.png; exit 1; }

      - name: Comprobar la vista previa al compartir
        run: |
          # Sin NEXT_PUBLIC_SITE_URL, Next resuelve og:image contra localhost y
          # el enlace pegado en WhatsApp sale con un rectangulo gris. La pagina
          # se ve perfecta: el fallo solo existe fuera del navegador, asi que
          # tiene que comprobarse aqui o no se comprueba nunca.
          imagen="$(curl -s --max-time 60 'https://citas.posxml.com/' \
            | grep -o '<meta property="og:image" content="[^"]*"' | head -1)"
          echo "$imagen"
          case "$imagen" in
            *'https://citas.posxml.com/og/home.png'*) ;;
            *) echo "::error::og:image no apunta al dominio: revisa NEXT_PUBLIC_SITE_URL en el .env"; exit 1 ;;
          esac
          codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            'https://citas.posxml.com/og/home.png')"
          echo "/og/home.png -> $codigo"
          [ "$codigo" = "200" ] || { echo "::error::la tarjeta de vista previa no existe"; exit 1; }

      - name: Comprobar que el arabe se declara arabe
        run: |
          # Un idioma equivocado no cambia el codigo HTTP: se lee en el documento.
          etiqueta="$(curl -s --max-time 60 'https://citas.posxml.com/i/ejemplo-ar' \
            | grep -o '<html[^>]*>' | head -1)"
          echo "$etiqueta"
          case "$etiqueta" in
            *'lang="ar"'*'dir="rtl"'*) ;;
            *) echo "::error::la invitacion arabe no se declara ar/rtl"; exit 1 ;;
          esac
