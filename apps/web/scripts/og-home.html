<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Amiri'; src: url('../public/fonts/Amiri-700.ttf'); font-weight: 700; }
  @font-face { font-family: 'Playfair'; src: url('../public/fonts/PlayfairDisplay-500.ttf'); font-weight: 500; }
  @font-face { font-family: 'Inter'; src: url('../public/fonts/Inter-400.ttf'); font-weight: 400; }

  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #14120e; color: #f4efe6;
    display: flex; align-items: center; justify-content: center;
    position: relative; font-family: 'Inter', sans-serif;
  }
  /* The same warm glow the home page opens with, so the card and the site
     read as one thing. */
  .glow {
    position: absolute; inset-block-start: -320px; inset-inline-start: 50%;
    transform: translateX(-50%);
    width: 900px; height: 640px; border-radius: 50%;
    background: #c9a227; opacity: 0.16; filter: blur(140px);
  }
  .frame {
    position: absolute; inset: 28px;
    border: 1px solid #3a3122;
  }
  .stack {
    position: relative; display: flex; flex-direction: column;
    align-items: center; gap: 26px; padding-inline: 80px; text-align: center;
  }
  /* La marca, la misma que la cabecera y el icono de la pestaña: quien ve
     esta tarjeta en un grupo de WhatsApp tiene que reconocer el sitio al
     entrar. */
  .brand {
    display: flex; align-items: center; gap: 16px;
    font-family: 'Playfair', serif; font-size: 30px;
    letter-spacing: 0.34em; text-transform: uppercase; color: #c9a227;
  }
  .brand img { width: 46px; height: 46px; }
  /* El interletraje deja un hueco muerto detrás de la ultima letra. */
  .brand span { margin-inline-end: -0.34em; }
  .ar { font-family: 'Amiri', serif; font-size: 74px; line-height: 1.35; }
  .ar em { font-style: normal; color: #e4c76b; }
  .latin { font-family: 'Playfair', serif; font-size: 34px; color: #cdc4b2; }
  .rule { width: 120px; height: 1px; background: #4a3f26; }
  .langs { font-size: 20px; letter-spacing: 0.08em; color: #8a7f68; }
</style>
<div class="glow"></div>
<div class="frame"></div>
<div class="stack">
  <p class="brand"><img src="../public/brand/mark-outline.svg" alt="" /><span>Citas</span></p>
  <p class="ar" dir="rtl" lang="ar">دعوتك، بلغة كل <em>مدعوّ</em></p>
  <div class="rule"></div>
  <p class="latin">Tu invitación, en el idioma de cada invitado</p>
  <p class="langs" dir="ltr">العربية · Español · Português · English</p>
</div>
