<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Citas">
  <!--
    La marca: un arco apuntado con una estrella dentro.

    Dibujado a mano en geometría, no generado. El arco apuntado es la forma que
    comparten la arquitectura del Levante y la tarjeta de boda de toda la vida,
    y la estrella de cuatro puntas es el adorno que ya lleva la portada. Se lee
    a 16 píxeles, que es donde vive un icono de pestaña.

    Los dos arcos son de radio 25.46 y se cruzan en (32, 8): con el radio
    «equilátero» —la anchura de la tarjeta— la punta se saldría del lienzo.
  -->
  <path d="M14 56 L14 26 A 25.46 25.46 0 0 1 32 8 A 25.46 25.46 0 0 1 50 26 L50 56 Z" fill="#C9A227"/>
  <path d="M32 22.5 Q33.4 31.5 41 33 Q33.4 34.5 32 43.5 Q30.6 34.5 23 33 Q30.6 31.5 32 22.5 Z" fill="#14120E"/>
</svg>
